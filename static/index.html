</style><header><strong><span class="brand">✧</span> MemberShip AI</strong><small>V1.4 · 消费者全流程 / 独立概念验证</small><a href="#trace" style="color:#777;text-decoration:none">决策日志 ↓</a></header><main class="shell"><div class="phonewrap"><div class="consumer-demo"><b>消费者端预览</b><span class="stepnote">演示数据 · 不产生实际交易</span></div><section class="phone"><div class="status"><span>9:41</span><span>▮▮▮ 5G ▰</span></div><div class="nav"><button id="back" aria-label="返回" disabled>‹</button><span class="brand">✧</span><span id="navtitle">AI 万能搜</span><span class="dots">···</span></div><div id="entry"><div class="query"><textarea id="query">周末想去杭州住一晚，想要早餐，晚上看场电影，预算600左右。</textarea><small>✦ 消费需求理解</small></div><button class="mainbtn" id="run">生成消费方案</button></div><div id="result" class="result"><div class="muted">正在准备模拟消费方案…</div></div></section></div><aside class="side"><h1>场景权益决策</h1><p>消费者端与模拟业务接口联动。修改输入，实时观察推荐变化。</p><div class="panel"><h2>用户与模型</h2><div class="choices" id="members"><button class="on" data-v="vip">88VIP 已开通</button><button data-v="normal">尚未开卡</button></div><div class="fields"><div><label for="fee">模拟开卡年费 ¥</label><input type="number" id="fee" min="0" value="88"></div><div><label for="mode">意图理解方式</label><select id="mode"><option value="rules">规则基线</option><option value="llm">大模型（需配置）</option></select></div></div><div class="checks"><label><input type="checkbox" id="qualified" checked> 开卡及即时使用资格已模拟核验</label></div><div class="source" id="modelstatus"></div></div><div class="panel"><h2>快速场景</h2><div class="scenarios"><button data-s="trip">周末旅行</button><button data-s="movie">单独观影</button><button data-s="food">点外卖</button><button data-s="refund">申请退票</button><button data-s="overlap">权益重叠</button><button data-s="unknown">资格未知</button></div></div><div class="panel"><h2>模拟业务接口</h2><p class="source">价格、余额、资格及服务条件是测试输入，不代表真实订单。</p><div id="orders"></div></div><div class="panel" id="trace"><details open><summary>决策日志 · 研发 / 评测</summary><div class="trace" id="log">等待运行</div></details></div><div class="panel"><details><summary>权益知识库 · 来源及核验边界</summary><div class="trace" id="kb">加载中</div></details></div></aside></main><script>
if(location.protocol==='file:'){document.getElementById('result').innerHTML='<div class="warning">当前直接打开了 HTML 文件，无法连接后台。请在终端进入项目文件夹，执行 <b>python3 server.py</b>，再打开 <a href="http://127.0.0.1:8000">http://127.0.0.1:8000</a>。</div>';document.getElementById('run').disabled=true;throw new Error('Please start the local HTTP server.');}
const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let member='vip';const scenes={hotel:'酒店含早方案',movie:'观影',food:'闪购外卖',refund:'机票退票费'};const defaults={hotel:{price:606,alternative:498,covered_people:1},movie:{price:65},food:{price:35},refund:{price:1000}};let data={};function reset(){data=Object.fromEntries(Object.entries(defaults).map(([k,v])=>[k,{...v,provided:true,eligible:true,state:'available',covered:false,worse:false,new_eligible:true}]))}reset();function drawOrders(){ $('orders').innerHTML=Object.entries(data).map(([k,v])=>`<details style="border-top:1px solid #eee;padding:12px 0" ${k==='hotel'?'open':''}><summary>${scenes[k]}</summary><div class="fields"><div><label>原方案金额 ¥</label><input type="number" min="0" data-k="${k}" data-f="price" value="${v.price}"></div><div><label>权益状态</label><select data-k="${k}" data-f="state">${[['available','可用'],['unclaimed','待领取'],['used','已用尽'],['expired','已过期'],['unknown','未知']].map(([a,b])=>`<option value="${a}" ${a===v.state?'selected':''}>${b}</option>`).join('')}</select></div>${k==='hotel'?`<div><label>无早房价 ¥</label><input type="number" min="0" data-k="${k}" data-f="alternative" value="${v.alternative}"></div><div><label>早餐覆盖人数</label><input type="number" min="0" data-k="${k}" data-f="covered_people" value="${v.covered_people}"></div>`:''}</div><div class="checks">${[['provided','订单已取得'],['eligible','符合模拟规则'],['covered','已有同等权益'],['worse','替代服务更差'],...(k==='refund'?[['new_eligible','新开卡适用已有订单']]:[])].map(([f,n])=>`<label><input type="checkbox" data-k="${k}" data-f="${f}" ${v[f]?'checked':''}> ${n}</label>`).join('')}</div></details>`).join('');$('orders').querySelectorAll('[data-k]').forEach(el=>el.onchange=()=>{data[el.dataset.k][el.dataset.f]=el.type==='checkbox'?el.checked:el.type==='number'?Number(el.value):el.value;run()})}
function setMember(v){member=v;document.querySelectorAll('[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===v))}document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{setMember(b.dataset.v);run()});let scenario={trip:'周末想去杭州住一晚，想要早餐，晚上看场电影，预算600左右。',movie:'周末看场电影，预算100元。',food:'今天想点外卖，预算40元。',refund:'我需要申请国内机票退票。',overlap:'周末住酒店，需要早餐，预算600元。',unknown:'周末看场电影。'};document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{reset();$('query').value=scenario[b.dataset.s];setMember(b.dataset.s==='overlap'?'normal':'vip');if(b.dataset.s==='overlap')data.hotel.covered=true;if(b.dataset.s==='unknown')data.movie.state='unknown';drawOrders();run()});const labels={use:'为你找到适用的会员权益',open:'这次消费，开通会员更划算',adjust_budget:'帮你看看怎样更划算',silent:'为你整理了消费方案',verify:'还有一些权益条件需要确认',no_intent:'告诉我你想买什么'};
const status={use:'可使用',claim:'待领取',potential:'开卡后预计可用',covered:'已有权益',silent:'暂不可用',unknown:'待确认'};
const sceneNames={hotel:'酒店住宿',movie:'电影票',food:'闪购外卖',refund:'机票退票'};
let seq=0,last=null,screen='result',choice='benefits',detailFocus=null;const fmt=n=>'¥'+Number(n).toFixed(2).replace(/\.00$/,'');
const applicable=x=>['use','claim','potential'].includes(x.state)&&x.saving>0;
function explain(x){const o=data[x.scene]||{};if(x.state==='covered')return '你已有其他会员权益，无需重复开通。';if(x.state==='unknown'){if(!o.provided)return '还未获取订单价格，暂时无法计算优惠。';if(x.scene==='hotel'&&o.covered_people<(last?.intent.people||1))return '免费早餐人数可能不足，需确认额外早餐费用。';if(x.scene==='refund'&&!last?.member&&!o.new_eligible)return '需确认新开会员是否适用于已购机票。';return '请先确认权益资格和使用条件。'}if(x.state==='silent'){if(o.state==='expired')return '该权益已过期。';if(o.state==='used')return '该权益已用完。';if(o.worse)return '其他方案的服务或退改条件更适合你。';if(x.scene==='hotel'&&!last?.intent.breakfast)return '本次不需要早餐，暂不推荐该权益。';return '本次订单暂不符合使用条件。'}if(x.scene==='hotel')return '相同房型、相同退改条件，使用会员免费早餐更划算。';if(x.scene==='movie')return (x.state==='claim'?'先领取观影券，':'')+'满5.01元可用，领取后当月有效。';if(x.scene==='food')return (x.state==='claim'?'先领取红包，':'')+'本单可享5元会员红包。';if(x.scene==='refund')return '符合条件的退票手续费可享88折。';return '可用于本次消费。'}
function steps(n){return `<div class="step">${['消费方案','权益详情','确认方案'].map((v,i)=>`${i?'<i></i>':''}${i+1===n?`<b>${i+1} ${v}</b>`:`<span>${i+1} ${v}</span>`}`).join('')}</div>`}
function button(label,action,primary=true){return `<button type="button" class="${primary?'primary':'secondary'}" data-go="${action}">${label}</button>`}
function cost(d,showAfter=true,original=false){let total=original?d.before:d.after;let budget=d.intent.budget;return `<div class="amounts"><div class="kv"><span>${d.member?'使用会员权益前':'不开通会员'}</span><b>${fmt(d.before)}</b></div>${showAfter?`${!d.member&&!original?`<div class="kv"><span>会员年费</span><b>${fmt(d.fee)}</b></div>`:''}<div class="kv total"><span>${original?'按原方案消费':d.member?'使用权益后预计支付':'开卡并使用权益后'}</span><b>${fmt(total)}</b></div>`:''}${budget!==null?`<div class="kv"><span>你的预算</span><b>${fmt(budget)}</b></div>${showAfter?`<div class="${total<=budget?'budget-ok':'budget-over'}">${total<=budget?`✓ 预算内，还剩 ${fmt(budget-total)}`:`超出预算 ${fmt(total-budget)}，建议先调整方案`}</div>`:''}`:''}</div>`}
function rowItem(x){return `<div class="item"><b>${esc(x.name)}</b><span class="state ${x.state}">${status[x.state]}</span>${x.saving>0?`<span class="price">省 ${fmt(x.saving)}</span>`:''}<div class="muted">${esc(explain(x))}</div></div>`}
function render(){if(!last)return;let d=last,i=d.intent,a=d.action,active=['use','open','adjust_budget'].includes(a);$('entry').hidden=screen!=='result';$('back').disabled=screen==='result';$('navtitle').textContent=({result:'AI 万能搜',detail:'会员权益详情',review:'确认消费方案',done:'方案已确认'})[screen];let body='';if(screen==='result'){let title=labels[a];let main=active?`<div class="member"><span class="tag">88VIP</span>${d.member?'你的会员专享':'本次开卡价值'}<h3>${d.member?'本次预计可省 ':'开卡后预计净省 '}${fmt(d.member?d.saving:d.net)}</h3><p>${a==='adjust_budget'?'已为你匹配优惠，但总支出仍超预算。':'这次消费可以用上'+d.items.filter(applicable).length+'项会员权益'+(d.member?'。':'，已扣除会员年费。')}</p><button type="button" class="member-link" data-go="detail">${a==='adjust_budget'?'查看调整建议':d.member?'查看权益详情':'查看开卡详情'} ›</button></div>`:a==='verify'?'<div class="warning">部分权益还需要确认，暂时无法保证本次优惠。</div>':a==='silent'?`<div class="quiet">${d.member?'本次暂时没有额外可用的会员权益。':d.items.some(x=>x.state==='covered')?'你已有适用的会员权益，无需重复开卡。':'仅看本次消费，暂时不需要开通88VIP。'}</div>`:'<div class="quiet">可以试试酒店住宿、看电影、点外卖等需求。</div>';body=`<h2><span class="brand">✧</span> ${title}</h2><div class="muted">${i.people}人 · ${i.scenes.map(k=>sceneNames[k]).join(' / ')||'等待你的消费需求'}</div>${main}${d.items.map(rowItem).join('')}${d.items.length?cost(d,active):''}${i.scenes.includes('hotel')?'<p class="quote-note">以上仅包含本次住宿及已列出的消费，交通等费用另计。</p>':''}<div class="actions">${active?button(a==='adjust_budget'?'查看并调整方案':d.member?'查看权益使用方案':'查看开卡与消费方案','detail'):a==='verify'?button('查看待确认条件','detail'):a==='silent'&&d.items.length?button('查看消费方案','detail'):''}${a!=='no_intent'?button('修改消费需求','edit',false):''}</div>`}
else if(screen==='detail'){body=steps(2)+`<div class="detail-title">${a==='adjust_budget'?'先找到预算内的方案':d.member?'你的会员权益方案':a==='open'?'开卡及权益使用方案':'本次消费方案'}</div><div class="detail-sub">${i.people}人 · ${i.scenes.map(k=>sceneNames[k]).join(' / ')}</div>${d.items.map(x=>`<div class="detail-card"><h3>${esc(x.name)} <span class="state ${x.state}">${status[x.state]}</span>${x.saving>0?`<span style="float:right;color:var(--orange)">省 ${fmt(x.saving)}</span>`:''}</h3><p>${esc(explain(x))}</p>${applicable(x)&&x.scene==='hotel'?`<div class="kv"><span>同等含早房价</span><b>${fmt(data.hotel.price)}</b></div><div class="kv"><span>无早房价 + 会员早餐</span><b>${fmt(data.hotel.alternative)}</b></div>`:''}${applicable(x)?`<p>${x.state==='claim'?'使用步骤：先领取权益，再选择适用订单。':x.state==='potential'?'使用步骤：确认开卡资格，开通后领取或激活权益。':'使用步骤：在对应消费渠道确认权益并使用。'}</p>`:''}</div>`).join('')}${cost(d,active)}${a==='adjust_budget'&&i.scenes.includes('hotel')?`<div class="detail-card"><h3>换一家更符合预算的酒店</h3><p>试用另一档示例报价，重新计算会员收益。</p>${button('试试更低房价','cheaper',false)}</div>`:''}<div class="actions">${active&&a!=='adjust_budget'?button(d.member?'继续确认消费方案':'继续确认开卡方案','review'):a==='adjust_budget'?button('修改需求或预算','edit'):a==='verify'?button('返回修改需求','edit'):d.items.length?button('按原方案继续','original'):''}${!d.member&&active?button('暂不开卡，按原方案继续','original',false):''}${button('返回消费方案','result',false)}</div>`}
else if(screen==='review'){let original=choice==='original';body=steps(3)+`<div class="detail-title">${original?'确认原消费方案':d.member?'确认权益使用方案':'确认开卡及消费方案'}</div><div class="detail-sub">请确认以下消费安排。</div>${d.items.map(x=>`<div class="detail-card"><h3>${sceneNames[x.scene]}</h3><div class="kv"><span>预计支付</span><b>${fmt(data[x.scene].price-(original?0:x.saving))}</b></div>${!original&&applicable(x)?`<p>${esc(x.name)} · ${status[x.state]}</p>`:''}</div>`).join('')}${cost(d,true,original)}<p class="quote-note">这是产品演示，不会真实开卡、订房、购票或扣款。</p><div class="actions">${button('确认方案（演示）','done')}${button('返回权益详情','detail',false)}</div>`}
else{let original=choice==='original';body=`<div class="checkmark">✓</div><h2 class="done-title">方案已确认</h2><p class="done-sub">你已完成本次体验流程，未产生实际订单或扣费。</p>${cost(d,true,original)}<div class="actions">${button('返回消费方案','result')}${button('体验其他消费场景','edit',false)}</div>`} $('result').innerHTML=body;}
function go(dest){if(!last)return;if(dest==='edit'){screen='result';render();$('query').focus();$('query').scrollIntoView({block:'center',behavior:'smooth'});return}if(dest==='cheaper'){const delta=Math.max(0,data.hotel.price-data.hotel.alternative);const reduction=Math.min(100,Math.max(0,data.hotel.alternative-1));data.hotel.alternative-=reduction;data.hotel.price=data.hotel.alternative+delta;drawOrders();run('detail');return}if(dest==='review')choice='benefits';if(dest==='original'){choice='original';dest='review'}screen=dest;render();document.querySelector('.phonewrap').scrollIntoView({block:'start',behavior:'smooth'});}
$('result').addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b)go(b.dataset.go)});$('back').onclick=()=>go(screen==='done'?'result':screen==='review'?'detail':'result');
async function run(next='result'){let id=++seq;$('run').disabled=true;$('run').textContent='正在匹配…';try{let r=await fetch('/api/recommend',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:$('query').value,member,mode:$('mode').value,fee:Number($('fee').value),qualified:$('qualified').checked,orders:data})});if(!r.ok)throw Error('服务请求失败');let d=await r.json();if(id!==seq)return;last=d;screen=typeof next==='string'?next:'result';choice='benefits';render();$('log').textContent=JSON.stringify({意图:d.intent,会员身份:member,决策:d.action,模型异常:d.warning,权益核验:d.items.map(x=>({权益:x.id,状态:x.state,原因:x.reason,节省:x.saving})),模拟金额:{原方案:d.before,权益:d.saving,年费:d.fee,方案:d.after,净收益:d.net}},null,2)}catch(e){$('entry').hidden=false;$('result').textContent='暂时无法生成方案，请稍后重试。如果正在本地运行，请确认 Python 服务已启动。'}finally{if(id===seq){$('run').disabled=false;$('run').textContent='生成消费方案'}}}
$('run').onclick=run;$('mode').onchange=run;$('qualified').onchange=run;$('fee').onchange=run;drawOrders();fetch('/api/status').then(r=>r.json()).then(d=>{$('modelstatus').innerHTML=`<span class="dot ${d.llm_configured?'ok':''}"></span>${d.cloud_demo?'在线演示 · 规则基线（不调用大模型）':d.llm_configured?'模型已配置（连通性待验证）':'未配置大模型，当前可运行规则基线'}`});fetch('/api/benefits').then(r=>r.json()).then(d=>{$('kb').innerHTML=d.map(b=>`<p><b>${esc(b.name)}</b><br>${esc(b.source)}<br>${esc(b.verified)}</p>`).join('')});run();
</script></html>
